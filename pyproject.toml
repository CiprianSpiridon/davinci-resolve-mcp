[project]
name = "davinci-resolve-mcp"
version = "1.0.0"
description = "Full-coverage Model Context Protocol (MCP) server for DaVinci Resolve Studio — control editing, media, color, Fusion, Fairlight, AI features, and rendering from any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "davinci-resolve-mcp contributors" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "davinci-resolve",
    "blackmagic",
    "video-editing",
    "color-grading",
    "fusion",
    "claude",
    "ai",
]
dependencies = [
    "mcp[cli]>=1.3.0",
    # macOS-only: used by the screenshot tool to target the Resolve window.
    # Harmless to omit on other platforms — the screenshot tool degrades gracefully.
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Local speech-to-text. mlx-whisper is Apple-Silicon only; elsewhere fall back to
# openai-whisper. transcription_engine tries mlx first, then openai-whisper.
transcription = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "openai-whisper>=20231117; sys_platform != 'darwin'",
]
# Cross-platform screenshot backend for Windows/Linux (macOS uses the bundled
# `screencapture` + optional pyobjc-Quartz declared above).
screenshot = [
    "mss>=9.0; sys_platform != 'darwin'",
    "pillow>=10.0; sys_platform != 'darwin'",
]

[project.scripts]
davinci-resolve-mcp = "davinci_resolve_mcp.server:main"

[project.urls]
Homepage = "https://github.com/CiprianSpiridon/davinci-resolve-mcp"
Repository = "https://github.com/CiprianSpiridon/davinci-resolve-mcp"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
